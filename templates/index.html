﻿﻿<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM - Asistente de IA para el Adulto Mayor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .app-container {
            width: 380px;
            height: 700px;
            background: #000000;
            border: 2px solid transparent;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(0, 255, 225, 0.25),
                0 0 60px rgba(255, 0, 212, 0.15),
                0 20px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            background-clip: padding-box;
        }

        /* Borde neón animado del contenedor principal */
        .app-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(135deg, #00ffe1, #aaff00, #ff00d4, #00ffe1);
            background-size: 300% 300%;
            animation: neonBorder 8s linear infinite;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes neonBorder {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .header {
            text-align: center;
            padding: 22px 20px 14px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        /* Quitamos el SVG de balanzas: ya no se usa en el HTML, pero dejamos la
           regla neutra por si el navegador aún lo referencia */
        .scales-icon { display: none; }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00ffe1 0%, #aaff00 50%, #ff00d4 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: logoShift 6s linear infinite;
            text-shadow: 0 0 18px rgba(0, 255, 225, 0.35);
        }

        @keyframes logoShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .profile-section {
            text-align: center;
            position: relative;
        }
        
        .avatar-container {
            width: 220px !important;
            height: 220px !important;
            margin: 0 auto 18px !important;
            position: relative;
            z-index: 10;
        }

        /* Sin círculo, sin nada que tape el GIF */
        .avatar {
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            overflow: visible !important;
            position: relative;
            z-index: 10;
        }

        /* El GIF animado se muestra plano, grande y siempre visible */
        .avatar img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
            object-position: center !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            /* Evita alt-text visible mientras carga */
            color: transparent !important;
            font-size: 0 !important;
            line-height: 0 !important;
            text-indent: -9999px !important;
            visibility: visible !important;
            opacity: 1 !important;
            /* Glow neón alrededor del GIF (no recorta nada) */
            filter: drop-shadow(0 0 22px rgba(0, 255, 225, 0.55))
                    drop-shadow(0 0 36px rgba(255, 0, 212, 0.30));
            animation: avatarBreathe 4s ease-in-out infinite;
        }

        /* Halo neón rotatorio detrás del avatar */
        .avatar::before {
            content: '' !important;
            position: absolute !important;
            top: -10% !important;
            left: -10% !important;
            right: -10% !important;
            bottom: -10% !important;
            width: 120% !important;
            height: 120% !important;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(0, 255, 225, 0.55),
                rgba(170, 255, 0, 0.45),
                rgba(255, 0, 212, 0.55),
                rgba(0, 255, 225, 0.55)
            );
            filter: blur(28px);
            z-index: -1 !important;
            animation: neonSpin 6s linear infinite;
            opacity: 0.85;
        }

        @keyframes neonSpin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Los pulse-rings quedan detrás del avatar */
        .pulse-rings {
            z-index: 1 !important;
        }

        /* Separación entre avatar y textos del perfil */
        .profile-name {
            margin-top: 14px !important;
        }

        /* Estados del avatar */
        .avatar.avatar--idle img {
            filter: drop-shadow(0 0 22px rgba(0, 255, 225, 0.55))
                    drop-shadow(0 0 36px rgba(255, 0, 212, 0.30));
        }

        .avatar.avatar--listening img {
            filter: drop-shadow(0 0 26px rgba(170, 255, 0, 0.75))
                    drop-shadow(0 0 40px rgba(0, 255, 225, 0.50));
            animation: avatarListening 1.6s ease-in-out infinite;
        }
        .avatar.avatar--listening::before {
            background: conic-gradient(
                from 0deg,
                rgba(170, 255, 0, 0.75),
                rgba(0, 255, 225, 0.65),
                rgba(170, 255, 0, 0.75)
            );
        }

        .avatar.avatar--speaking img {
            filter: drop-shadow(0 0 28px rgba(255, 0, 212, 0.80))
                    drop-shadow(0 0 44px rgba(170, 255, 0, 0.55));
            animation: avatarSpeaking 0.9s ease-in-out infinite;
        }
        .avatar.avatar--speaking::before {
            background: conic-gradient(
                from 0deg,
                rgba(255, 0, 212, 0.75),
                rgba(0, 255, 225, 0.65),
                rgba(255, 0, 212, 0.75)
            );
        }

        @keyframes avatarBreathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        @keyframes avatarListening {
            0%, 100% { transform: scale(1.00); }
            50%      { transform: scale(1.06); }
        }

        @keyframes avatarSpeaking {
            0%, 100% { transform: scale(1.00); }
            25%      { transform: scale(1.08); }
            50%      { transform: scale(1.02); }
            75%      { transform: scale(1.10); }
        }
        
        .online-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(170, 255, 0, 0.95), rgba(0, 255, 225, 0.95));
            color: #0a0a2a;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 10px;
            white-space: nowrap;
            z-index: 3;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 14px rgba(170, 255, 0, 0.6);
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.85; transform: scale(1.05); }
        }
        
        .pulse-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            z-index: 1;
            opacity: 1;
        }
        
        .pulse-rings.active {
            opacity: 1;
        }
        
        .pulse-ring {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: pulse 2s ease-out infinite;
        }
        
        .pulse-ring:nth-child(2) { animation-delay: 0.3s; }
        .pulse-ring:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0% { transform: scale(0.75); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        
        .phone-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            display: none;
        }
        
        .phone-waves.active {
            display: block;
        }
        
        .phone-wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #00ffe1;
            border-radius: 50%;
            animation: phoneWaveAnim 1.5s ease-out infinite;
            box-shadow: 0 0 14px rgba(0, 255, 225, 0.45);
        }

        .phone-wave:nth-child(2) { animation-delay: 0.5s; }
        .phone-wave:nth-child(3) { animation-delay: 1s; }

        @keyframes phoneWaveAnim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .phone-waves.ringing .phone-wave {
            border-color: #00ffe1;
        }

        .phone-waves.connected .phone-wave {
            border-color: #ff00d4;
            animation: none;
            display: none;
        }

        .call-timer {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            padding: 5px 0;
            font-variant-numeric: tabular-nums;
        }

        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 30px;
            padding: 5px 0;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .waveform.active { opacity: 1; }

        .waveform .bar {
            width: 3px;
            background: linear-gradient(180deg, #00ffe1 0%, #ff00d4 100%);
            border-radius: 2px;
            animation: waveAnim 1s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(0, 255, 225, 0.5);
        }
        .waveform .bar:nth-child(1) { animation-delay: 0s; }
        .waveform .bar:nth-child(2) { animation-delay: 0.1s; }
        .waveform .bar:nth-child(3) { animation-delay: 0.2s; }
        .waveform .bar:nth-child(4) { animation-delay: 0.3s; }
        .waveform .bar:nth-child(5) { animation-delay: 0.15s; }
        .waveform .bar:nth-child(6) { animation-delay: 0.25s; }
        .waveform .bar:nth-child(7) { animation-delay: 0.05s; }

        @keyframes waveAnim {
            0%, 100% { height: 6px; opacity: 0.5; }
            50% { height: 24px; opacity: 1; }
        }

        .waveform.speaking .bar {
            background: linear-gradient(180deg, #ff00d4 0%, #aaff00 100%);
            box-shadow: 0 0 8px rgba(255, 0, 212, 0.7);
        }
        .waveform.listening .bar {
            background: linear-gradient(180deg, #aaff00 0%, #00ffe1 100%);
            box-shadow: 0 0 8px rgba(170, 255, 0, 0.7);
        }

        .call-transcript {
            font-size: 11px;
            color: rgba(255,255,255,0.85);
            text-align: center;
            padding: 4px 12px;
            min-height: 30px;
            max-height: 50px;
            overflow-y: auto;
            line-height: 1.3;
            font-style: italic;
        }
        
        .profile-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00ffe1 0%, #aaff00 50%, #ff00d4 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(0, 255, 225, 0.25);
        }

        .profile-title {
            font-size: 12px;
            color: rgba(170, 255, 0, 0.9);
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            flex-shrink: 0;
        }
        
        .mode-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 225, 0.4);
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(0, 255, 225, 0.25), rgba(255, 0, 212, 0.25));
            color: #ffffff;
            border-color: rgba(0, 255, 225, 0.8);
            box-shadow: 0 0 14px rgba(0, 255, 225, 0.35);
        }

        .mode-btn:hover {
            background: rgba(0, 255, 225, 0.12);
            border-color: rgba(0, 255, 225, 0.7);
        }
        
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        .call-view, .chat-view {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        
        .call-view.active, .chat-view.active {
            display: flex;
        }
        
        .chat-view {
            display: none !important;
        }
        
        .call-view {
            justify-content: flex-end;
            align-items: center;
            padding: 15px;
            gap: 10px;
        }
        
        .call-messages {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }
        
        .call-messages .buttons-container {
            padding: 5px 0;
        }
        
        .call-messages .option-btn {
            font-size: 12px;
            padding: 8px 14px;
            min-width: 110px;
        }
        
        .call-messages::-webkit-scrollbar {
            width: 3px;
        }
        
        .call-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
        
        .call-message {
            max-width: 90%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 12px;
            line-height: 1.3;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .call-message.bot {
            align-self: flex-start;
            background: rgba(10, 47, 87, 0.85);
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }
        
        .call-message.bot.error {
            background: rgba(232, 118, 10, 0.9);
            color: #000000;
            border: 1px solid #f5a623;
        }

        /* Mensaje del bot en modo llamada sin texto visible
           (porque el bot habla por voz). Solo se muestra el boton
           de speaker para volver a escucharlo. */
        .call-message.bot.bot-audio-only {
            background: transparent;
            color: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            padding: 4px 8px;
            min-height: 22px;
        }
        .call-message.bot.bot-audio-only .speak-btn {
            opacity: 0.65;
        }
        .call-message.bot.bot-audio-only .speak-btn:hover {
            opacity: 1;
        }
        
        .call-message.user {
            align-self: flex-end;
            background: rgba(37, 211, 102, 0.85);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        
        .call-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .action-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            font-size: 24px;
            position: relative;
            z-index: 3;
        }
        
        .whatsapp-button {
            background: linear-gradient(135deg, #00ffe1 0%, #ff00d4 100%);
            color: #ffffff;
            box-shadow: 0 0 24px rgba(0, 255, 225, 0.5),
                        0 0 36px rgba(255, 0, 212, 0.35);
        }

        .whatsapp-button:hover {
            background: linear-gradient(135deg, #aaff00 0%, #ff00d4 100%);
            transform: scale(1.06);
            box-shadow: 0 0 32px rgba(170, 255, 0, 0.6),
                        0 0 48px rgba(255, 0, 212, 0.45);
        }
        
        .end-call-button {
            background: #ef4444;
            color: #ffffff;
            display: none;
        }
        
        .end-call-button:hover {
            background: #dc2626;
            transform: scale(1.05);
        }
        
        .button-label {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            text-align: center;
        }
        
        .call-view.calling .whatsapp-button { display: none; }
        .call-view.calling .end-call-button { display: flex; }
        .call-view:not(.calling) .end-call-button { display: none; }
        
        .chat-view {
            padding: 0;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
        
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .message.bot {
            align-self: flex-start;
            background: #0a2f57;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }
        
        .message.bot.error {
            background: #e8760a;
            color: #000000;
            border: 1px solid #f5a623;
        }
        
        .message.user {
            align-self: flex-end;
            background: #25d366;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        
        .message.typing {
            background: #0a2f57;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        
        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .chat-input-area {
            padding: 10px 15px 15px;
            display: flex;
            gap: 8px;
            background: #0a2f57;
            flex-shrink: 0;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #0c447c;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        
        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .chat-input:focus {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00ffe1 0%, #ff00d4 100%);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 14px rgba(0, 255, 225, 0.45);
        }

        .send-btn:hover {
            background: linear-gradient(135deg, #aaff00 0%, #ff00d4 100%);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(170, 255, 0, 0.55);
        }

        .send-btn:disabled {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .send-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .status-indicator {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            flex-shrink: 0;
        }
        
        .error-message {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: #ffffff;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        
        .speak-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .speak-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .speak-btn.playing {
            background: #25d366;
        }
        
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
            justify-content: center;
            width: 100%;
        }
        
        .option-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 2px solid #f5c518;
            background: #f5c518;
            color: #000000;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-align: center;
            min-width: 120px;
        }
        
        .option-btn:hover {
            background: #e0b415;
            color: #000000;
            transform: scale(1.03);
            border-color: #e0b415;
        }
        
        .option-btn:active {
            transform: scale(0.98);
        }
        
        .option-btn.disabled {

        .option-btn-small {

        @media (max-width: 420px) {

        .goodbye-toast {

</head>

    <script>
        let currentMode = 'call';
        let isCalling = false;
        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let currentAudio = null;
        let chatHistory = [];
        let ringtoneInterval = null;
        let ringtoneCtx = null;
        let callStartTime = 0;
        let callTimerInterval = null;
        let callSequenceId = 0;
        let listeningTimeout = null;

        function updateCallTimer() {
            var elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            var m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            var s = String(elapsed % 60).padStart(2, '0');
            document.getElementById('callTimer').textContent = m + ':' + s;
        }

        function setWaveformState(state) {
            var wf = document.getElementById('callWaveform');
            if (!wf) return;
            wf.classList.remove('active', 'speaking', 'listening');
            if (state === 'speaking') { wf.classList.add('active', 'speaking'); }
            else if (state === 'listening') { wf.classList.add('active', 'listening'); }
            // Sincroniza el estado visual del avatar (GIF animado) con el waveform.
            setAvatarState(state === 'off' ? 'idle' : state);
        }

        /**
         * Cambia el estado visual del avatar GIF animado de IAM.
         * Estados: 'idle' (en línea), 'listening' (escuchando al usuario),
         * 'speaking' (IAM hablando).
         */
        function setAvatarState(state) {
            var av = document.querySelector('.avatar');
            if (!av) return;
            av.classList.remove('avatar--idle', 'avatar--listening', 'avatar--speaking');
            if (state === 'listening') av.classList.add('avatar--listening');
            else if (state === 'speaking') av.classList.add('avatar--speaking');
            else av.classList.add('avatar--idle');
        }

        function setTranscript(text) {
            var el = document.getElementById('callTranscript');
            if (el) el.textContent = text;
        }
        
        const CHAT_API_URL = '/api/chat';
        const SPEAK_API_URL = '/api/speak';
        
        function switchMode(mode) {
            currentMode = mode;
            
            document.getElementById('chatModeBtn').classList.toggle('active', mode === 'chat');
            document.getElementById('callModeBtn').classList.toggle('active', mode === 'call');
            
            document.getElementById('chatView').classList.toggle('active', mode === 'chat');
            document.getElementById('callView').classList.toggle('active', mode === 'call');
            
            if (mode === 'call') {
                document.getElementById('statusIndicator').textContent = 'Presione para hablar con IAM';
            } else {
                endCall();
                stopRingtone();
                document.getElementById('statusIndicator').textContent = 'Este sitio utiliza Agentes de Inteligencia Artificial';
            }
        }
        
        function playRingtone() {
            stopRingtone();
            ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
            let ringCount = 0;
            
            function playTone() {
                if (!ringtoneCtx || !isCalling) return;
                
                const osc1 = ringtoneCtx.createOscillator();
                const osc2 = ringtoneCtx.createOscillator();
                const gainNode = ringtoneCtx.createGain();
                
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = 440;
                osc2.frequency.value = 480;
                
                gainNode.gain.setValueAtTime(0, ringtoneCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, ringtoneCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.2, ringtoneCtx.currentTime + 0.3);
                gainNode.gain.linearRampToValueAtTime(0, ringtoneCtx.currentTime + 0.35);
                gainNode.gain.setValueAtTime(0, ringtoneCtx.currentTime + 0.4);
                gainNode.gain.linearRampToValueAtTime(0.2, ringtoneCtx.currentTime + 0.45);
                gainNode.gain.setValueAtTime(0.2, ringtoneCtx.currentTime + 0.75);
                gainNode.gain.linearRampToValueAtTime(0, ringtoneCtx.currentTime + 0.8);
                
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(ringtoneCtx.destination);
                
                osc1.start(ringtoneCtx.currentTime);
                osc2.start(ringtoneCtx.currentTime);
                osc1.stop(ringtoneCtx.currentTime + 0.8);
                osc2.stop(ringtoneCtx.currentTime + 0.8);
                
                ringCount++;
                if (ringCount >= 3) {
                    clearInterval(ringtoneInterval);
                    ringtoneInterval = null;
                }
            }
            
            playTone();
            ringtoneInterval = setInterval(playTone, 1000);
        }
        
        function stopRingtone() {
            if (ringtoneInterval) {
                clearInterval(ringtoneInterval);
                ringtoneInterval = null;
            }
            if (ringtoneCtx) {
                ringtoneCtx.close().catch(() => {});
                ringtoneCtx = null;
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatText();
            }
        }
        
        function sendChatText() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            document.getElementById('sendBtn').disabled = true;
            showTyping();
            
            var startTime = Date.now();
            
            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                var elapsed = Date.now() - startTime;
                var remaining = Math.max(0, 3000 - elapsed);
                setTimeout(function() {
                    hideTyping();
                    document.getElementById('sendBtn').disabled = false;
                    
                    if (data.error) {
                        addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                        return;
                    }
                    
                    addMessage(data.response, 'bot', data.buttons);
                    toggleUploadBtn('chat', data.show_upload);
                    
                    if (data.end_call) {
                        document.getElementById('chatMessages').innerHTML = '';
                        document.getElementById('chatInput').value = '';
                        var toast = document.getElementById('goodbyeToast');
                        toast.textContent = 'Gracias por conversar con IAM. Recuerde que aquí estaré siempre que me necesite. ¡Que tenga un día muy bonito!';
                        toast.classList.add('show');
                        setTimeout(function() {
                            toast.classList.remove('show');
                        }, 5000);
                    }
                }, remaining);
            })
            .catch(error => {
                hideTyping();
                document.getElementById('sendBtn').disabled = false;
                addMessage('Error de conexión. Verifica tu internet.', 'bot');
            });
        }
        
        function sendButtonAction(action, texto) {
            addMessage(texto, 'user');
            
            showTyping();
            
            var startTime = Date.now();
            
            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: texto, action: action })
            })
            .then(response => response.json())
            .then(data => {
                var elapsed = Date.now() - startTime;
                var remaining = Math.max(0, 3000 - elapsed);
                setTimeout(function() {
                    hideTyping();
                    
                    if (data.error) {
                        addMessage('Lo siento, hubo un error. Intenta de nuevo.', 'bot');
                        return;
                    }
                    
                    addMessage(data.response, 'bot', data.buttons);
                    toggleUploadBtn('chat', data.show_upload);
                    
                    if (data.end_call) {
                        document.getElementById('chatMessages').innerHTML = '';
                        document.getElementById('chatInput').value = '';
                        var toast = document.getElementById('goodbyeToast');
                        toast.textContent = 'Gracias por conversar con IAM. Recuerde que aquí estaré siempre que me necesite. ¡Que tenga un día muy bonito!';
                        toast.classList.add('show');
                        setTimeout(function() {
                            toast.classList.remove('show');
                        }, 5000);
                    }
                }, remaining);
            })
            .catch(error => {
                hideTyping();
                addMessage('Error de conexión. Verifica tu internet.', 'bot');
            });
        }
        
        function toggleUploadBtn(mode, show) {
            var btn = mode === 'call' ? document.getElementById('callUploadBtn') : document.getElementById('chatUploadBtn');
            if (btn) btn.style.display = show ? 'inline-flex' : 'none';
        }
        
        var chatSelectedFiles = [];
        var callSelectedFiles = [];
        
        function handleChatFileSelect(event) {
            var files = Array.from(event.target.files);
            chatSelectedFiles = chatSelectedFiles.concat(files);
            renderUploadPreview('chat');
        }
        
        function handleCallFileSelect(event) {
            var files = Array.from(event.target.files);
            callSelectedFiles = callSelectedFiles.concat(files);
            renderUploadPreview('call');
            sendCallMessage('He adjuntado mis pruebas. Por favor, continue con la descripción de mi caso.');
        }
        
        function renderUploadPreview(mode) {
            var files = mode === 'call' ? callSelectedFiles : chatSelectedFiles;
            var previewId = mode === 'call' ? 'callUploadPreview' : 'chatUploadPreview';
            var preview = document.getElementById(previewId);
            
            if (!files || files.length === 0) {
                preview.style.display = 'none';
                return;
            }
            
            preview.style.display = 'block';
            var html = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">';
            files.forEach(function(f, i) {
                var icon = 'ðŸ“„';
                if (f.type && f.type.startsWith('image/')) icon = 'ðŸ–¼ï¸';
                else if (f.type && f.type.startsWith('audio/')) icon = 'ðŸŽµ';
                html += '<span style="background:#2a2a4a;padding:4px 8px;border-radius:6px;font-size:11px;">' + icon + ' ' + f.name + ' <span style="cursor:pointer;color:#e8760a;" onclick="removeFile(\'' + mode + '\',' + i + ')">âœ•</span></span>';
            });
            html += '</div>';
            preview.innerHTML = html;
        }
        
        function removeFile(mode, index) {
            if (mode === 'call') {
                callSelectedFiles.splice(index, 1);
            } else {
                chatSelectedFiles.splice(index, 1);
            }
            renderUploadPreview(mode);
        }
        
        function addMessage(text, sender, buttons = null) {
            // Detectar si estamos en modo llamada o modo chat. En modo
            // llamada, el bot habla por voz, así que ocultamos el texto
            // de su respuesta para no saturar visualmente al adulto
            // mayor (solo dejamos el botón de speaker y los botones
            // opcionales si los hay).
            const inCallMode = (typeof currentMode !== 'undefined' && currentMode === 'call');
            const containerId = inCallMode ? 'callMessages' : 'chatMessages';
            const container = document.getElementById(containerId);
            const msg = document.createElement('div');
            const isError = sender === 'bot' && text.startsWith('Por favor, verifica');
            msg.className = isError ? 'message bot error' : `message ${sender}`;

            // En modo chat siempre mostramos el texto; en modo llamada
            // solo lo mostramos si el emisor es el usuario o si es un
            // mensaje de error que conviene ver.
            const showText = !inCallMode || sender !== 'bot';
            if (showText) {
                const textSpan = document.createElement('span');
                textSpan.textContent = text;
                msg.appendChild(textSpan);
            } else {
                // Marcamos el contenedor para que tenga un tamaño mínimo
                // y se vea el botón de speaker aunque no haya texto.
                msg.classList.add('bot-audio-only');
                // Guardamos el texto como data-attribute para que esté
                // disponible si se necesita (accesibilidad, replay).
                msg.dataset.transcript = text;
            }

            if (sender === 'bot') {
                const speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊';
                speakBtn.title = 'Volver a escuchar';
                speakBtn.onclick = function() { speakMessage(text, this); };
                msg.style.position = 'relative';
                msg.appendChild(speakBtn);
            }

            container.appendChild(msg);

            if (buttons && buttons.length > 0 && sender === 'bot') {
                const buttonsDiv = document.createElement('div');
                buttonsDiv.className = 'buttons-container';

                buttons.forEach(btn => {
                    const optionBtn = document.createElement('button');
                    optionBtn.className = 'option-btn';
                    optionBtn.textContent = btn.texto;
                    optionBtn.title = btn.descripcion || '';
                    optionBtn.onclick = function() {
                        sendButtonAction(btn.valor, btn.texto);
                        disableButtons(buttonsDiv);
                    };
                    buttonsDiv.appendChild(optionBtn);
                });

                container.appendChild(buttonsDiv);
            }

            container.scrollTop = container.scrollHeight;
        }
        
        function disableButtons(container) {
            const buttons = container.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.add('disabled');
            });
        }
        
        function showTyping() {
            const container = document.getElementById('chatMessages');
            const typing = document.createElement('div');
            typing.className = 'message bot typing';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
            document.getElementById('pulseRings').classList.add('active');
        }
        
        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
            document.getElementById('pulseRings').classList.remove('active');
        }
        
        function stopCurrentAudio() {
            if (currentAudio) {
                try {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                } catch(e) {}
                currentAudio = null;
            }
            isSpeaking = false;
            document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('playing'));
        }
        
        function speakMessage(text, btn) {
            stopCurrentAudio();
            
            if (btn && btn.classList.contains('playing')) return;
            
            if (btn) btn.classList.add('playing');
            isSpeaking = true;
            
            fetch(SPEAK_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (!isSpeaking) return;
                
                if (data.audioUrl) {
                    currentAudio = new Audio(data.audioUrl);
                    currentAudio.onended = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        if (btn) btn.classList.remove('playing');
                    };
                    currentAudio.onerror = function() {
                        isSpeaking = false;
                        currentAudio = null;
                        if (btn) btn.classList.remove('playing');
                    };
                    currentAudio.play().catch(() => {
                        isSpeaking = false;
                        if (btn) btn.classList.remove('playing');
                    });
                } else {
                    isSpeaking = false;
                    if (btn) btn.classList.remove('playing');
                }
            })
            .catch(() => {
                isSpeaking = false;
                if (btn) btn.classList.remove('playing');
            });
        }
        
        function startCall() {
            if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                showError("Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.");
                return;
            }
            
            if (isCalling) {
                endCall();
                return;
            }
            
            isCalling = true;
            isListening = false;
            isSpeaking = false;
            
            const callView = document.getElementById('callView');
            callView.classList.add('calling');
            document.getElementById('buttonLabel').textContent = 'Finalizar';
            document.getElementById('statusIndicator').textContent = 'Conectando...';
            document.getElementById('startCallBtn').style.background = 'linear-gradient(135deg, #00ffe1 0%, #ff00d4 100%)';
            
            const phoneWaves = document.getElementById('phoneWaves');
            phoneWaves.classList.add('active', 'ringing');
            
            clearCallMessages();
            playRingtone();
            
            // Show timer
            callStartTime = Date.now();
            document.getElementById('callTimer').style.display = 'block';
            callTimerInterval = setInterval(updateCallTimer, 1000);
            
            setTimeout(() => {
                if (!isCalling) return;
                phoneWaves.classList.remove('ringing');
                phoneWaves.classList.add('connected');
                document.getElementById('startCallBtn').style.background = 'linear-gradient(135deg, #ff00d4 0%, #aaff00 100%)';
                document.getElementById('statusIndicator').textContent = 'IAM está escuchando...';
                setWaveformState('speaking');
                sendCallMessage('', 'nueva_llamada');
            }, 3200);
        }
        
        function endCall() {
            isCalling = false;
            killAllCallAudio();
            stopRingtone();
            
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            
            const callView = document.getElementById('callView');
            callView.classList.remove('calling');
            document.getElementById('buttonLabel').textContent = 'Llamar';
            document.getElementById('startCallBtn').style.background = 'linear-gradient(135deg, #00ffe1 0%, #ff00d4 100%)';
            document.getElementById('pulseRings').classList.remove('active');
            
            const phoneWaves = document.getElementById('phoneWaves');
            phoneWaves.classList.remove('active', 'ringing', 'connected');
            
            if (currentMode === 'call') {
                document.getElementById('statusIndicator').textContent = 'Llamada finalizada';
                document.getElementById('callTimer').style.display = 'none';
                document.getElementById('callTimer').textContent = '00:00';
                setWaveformState('off');
                document.getElementById('callTranscript').textContent = '';
                if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
                // Log call to backend
                try {
                    var dur = Math.floor((Date.now() - callStartTime) / 1000);
                    fetch('/api/log-call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ duracion_segundos: dur, estado: 'completada' })
                    });
                } catch(e) {}
                setTimeout(() => {
                    if (!isCalling && currentMode === 'call') {
                        document.getElementById('statusIndicator').textContent = 'Presione para hablar con IAM';
                    }
                }, 3000);
            }
        }
        
        function addCallMessage(text, sender, buttons = null) {
            const container = document.getElementById('callMessages');
            const msg = document.createElement('div');
            const isError = sender === 'bot' && text.startsWith('Por favor, verifica');
            // En modo llamada ocultamos el texto del bot (porque habla
            // por voz). Los errores sí se muestran para que el usuario
            // pueda leerlos.
            const showText = sender !== 'bot' || isError;
            if (showText) {
                msg.className = isError ? 'call-message bot error' : `call-message ${sender}`;
                msg.textContent = text;
            } else {
                msg.className = 'call-message bot bot-audio-only';
                msg.dataset.transcript = text;
            }
            container.appendChild(msg);

            if (buttons && buttons.length > 0 && sender === 'bot') {
                const buttonsDiv = document.createElement('div');
                buttonsDiv.className = 'buttons-container';
                buttonsDiv.id = 'callButtonsContainer';

                buttons.forEach(btn => {
                    const optionBtn = document.createElement('button');
                    optionBtn.className = 'option-btn';
                    optionBtn.textContent = btn.texto;
                    optionBtn.title = btn.descripcion || '';
                    optionBtn.onclick = function() {
                        sendCallButtonAction(btn.valor, btn.texto);
                        disableButtons(buttonsDiv);
                    };
                    buttonsDiv.appendChild(optionBtn);
                });

                container.appendChild(buttonsDiv);
            }

            container.scrollTop = container.scrollHeight;
        }
        
        function clearCallMessages() {
            const container = document.getElementById('callMessages');
            container.innerHTML = '';
        }
        
        function sendCallMessage(message, action = null) {
            if (!isCalling) return;
            killAllCallAudio();
            
            document.getElementById('statusIndicator').textContent = "Respondiendo...";
            if (message) addCallMessage(message, 'user');
            
            var body = { message: message || '' };
            if (action) body.action = action;
            
            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (!isCalling) return;
                if (data.error) {
                    showError("Error procesando tu mensaje.");
                    callPromptRetry();
                    return;
                }
                addCallMessage(data.response, 'bot', data.buttons);
                toggleUploadBtn('call', data.show_upload);
                var hasButtons = data.buttons && data.buttons.length > 0;
                callSpeak(data.response, data.end_call, hasButtons);
            })
            .catch(function() {
                if (!isCalling) return;
                showError("Error de conexión.");
                callPromptRetry();
            });
        }
        
        function sendCallButtonAction(action, texto) {
            if (!isCalling) return;
            killAllCallAudio();
            
            document.getElementById('statusIndicator').textContent = "Respondiendo...";
            addCallMessage(texto, 'user');
            
            fetch(CHAT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: texto, action: action })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (!isCalling) return;
                if (data.error) {
                    showError("Error procesando tu mensaje.");
                    callPromptRetry();
                    return;
                }
                addCallMessage(data.response, 'bot', data.buttons);
                toggleUploadBtn('call', data.show_upload);
                var hasButtons = data.buttons && data.buttons.length > 0;
                callSpeak(data.response, data.end_call, hasButtons);
            })
            .catch(function() {
                if (!isCalling) return;
                showError("Error de conexión.");
                callPromptRetry();
            });
        }
        
        function killAllCallAudio() {
            callSequenceId++;
            stopListeningTimeout();
            isListening = false;
            isSpeaking = false;
            
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }
            if (currentAudio) {
                currentAudio.onended = null;
                currentAudio.onerror = null;
                try { currentAudio.pause(); } catch(e) {}
                currentAudio = null;
            }
        }
        
        function callSpeak(text, endCallAfter, hasButtons) {
            if (!isCalling) return;
            killAllCallAudio();
            
            var seqId = callSequenceId;
            isSpeaking = true;
            stopRingtone();
            setWaveformState('speaking');
            setTranscript(text);
            document.getElementById('statusIndicator').textContent = "IAM está hablando...";
            
            fetch(SPEAK_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (!isCalling || seqId !== callSequenceId) return;
                if (data.audioUrl) {
                    currentAudio = new Audio(data.audioUrl);
                    currentAudio.onended = function() {
                        if (seqId !== callSequenceId) return;
                        currentAudio = null;
                        isSpeaking = false;
                        setWaveformState('off');
                        if (!isCalling) return;
                        if (endCallAfter) { endCall(); return; }
                        if (hasButtons) {
                            document.getElementById('statusIndicator').textContent = "Seleccione una opción";
                        } else {
                            callBeepThenListen();
                        }
                    };
                    currentAudio.onerror = function() {
                        if (seqId !== callSequenceId) return;
                        currentAudio = null;
                        isSpeaking = false;
                        if (!isCalling) return;
                        if (endCallAfter) { endCall(); return; }
                        if (hasButtons) {
                            document.getElementById('statusIndicator').textContent = "Seleccione una opción";
                        } else {
                            callBeepThenListen();
                        }
                    };
                    currentAudio.play().catch(function() {
                        if (seqId !== callSequenceId) return;
                        currentAudio = null;
                        isSpeaking = false;
                        if (!isCalling) return;
                        if (endCallAfter) { endCall(); return; }
                        if (hasButtons) {
                            document.getElementById('statusIndicator').textContent = "Seleccione una opción";
                        } else {
                            callBeepThenListen();
                        }
                    });
                } else {
                    isSpeaking = false;
                    if (!isCalling) return;
                    if (endCallAfter) { endCall(); return; }
                    if (hasButtons) {
                        document.getElementById('statusIndicator').textContent = "Seleccione una opción";
                    } else {
                        callBeepThenListen();
                    }
                }
            })
            .catch(function() {
                if (seqId !== callSequenceId) return;
                isSpeaking = false;
                if (!isCalling) return;
                if (endCallAfter) { endCall(); return; }
                if (hasButtons) {
                    document.getElementById('statusIndicator').textContent = "Seleccione una opción";
                } else {
                    callBeepThenListen();
                }
            });
        }
        
        function callBeepThenListen() {
            if (!isCalling) return;
            var seqId = callSequenceId;
            
            var beepCtx = new (window.AudioContext || window.webkitAudioContext)();
            var osc = beepCtx.createOscillator();
            var gain = beepCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.3, beepCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, beepCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(beepCtx.destination);
            osc.start(beepCtx.currentTime);
            osc.stop(beepCtx.currentTime + 0.3);
            osc.onended = function() {
                beepCtx.close().catch(function() {});
                if (!isCalling || seqId !== callSequenceId) return;
                document.getElementById('statusIndicator').textContent = "Escuchando...";
                callStartListening();
            };
        }
        
        function callStartListening() {
            if (!isCalling || isSpeaking) return;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }
            isListening = false;
            
            var seqId = callSequenceId;
            
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'es-MX';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = function() {
                if (!isCalling || seqId !== callSequenceId) return;
                isListening = true;
                setWaveformState('listening');
                document.getElementById('statusIndicator').textContent = "Escuchando...";
                setTranscript("Escuchando...");
            };
            
            recognition.onresult = function(event) {
                if (!isCalling || seqId !== callSequenceId) return;
                var transcript = event.results[0][0].transcript;
                isListening = false;
                stopListeningTimeout();
                setWaveformState('off');
                setTranscript('Tu: ' + transcript);
                try { recognition.stop(); } catch(e) {}
                recognition = null;
                if (transcript && transcript.trim().length > 0) {
                    sendCallMessage(transcript);
                } else {
                    callPromptRetry();
                }
            };
            
            recognition.onerror = function(event) {
                if (seqId !== callSequenceId) return;
                isListening = false;
                stopListeningTimeout();
                if (event.error === 'no-speech') {
                    callPromptRetry();
                } else if (event.error === 'not-allowed') {
                    showError("Permiso de micrófono denegado. Activa el micrófono en tu navegador.");
                    setTranscript("Permiso de micrófono requerido");
                    setWaveformState('off');
                } else if (event.error === 'network') {
                    showError("Error de red. Verifica tu conexión a internet.");
                    setTranscript("Error de red");
                    setWaveformState('off');
                } else if (event.error !== 'aborted') {
                    setTranscript("Reintentando...");
                    setTimeout(function() {
                        if (!isCalling || seqId !== callSequenceId) return;
                        callStartListening();
                    }, 2000);
                }
            };
            
            recognition.onend = function() {
                if (seqId !== callSequenceId) return;
                isListening = false;
                setWaveformState('off');
            };
            
            try {
                recognition.start();
            } catch(e) {
                recognition = null;
            }
            
            startListeningTimeout();
        }
        
        function callPromptRetry() {
            if (!isCalling) return;
            setTranscript("No te escuché bien...");
            callSpeak("No te escuché bien. Por favor, indica el dato después de la señal.", false, false);
        }
        
        function startListeningTimeout() {
            stopListeningTimeout();
            listeningTimeout = setTimeout(function() {
                if (!isCalling || isSpeaking) return;
                callPromptRetry();
            }, 7000);
        }
        
        function stopListeningTimeout() {
            if (listeningTimeout) {
                clearTimeout(listeningTimeout);
                listeningTimeout = null;
            }
        }
        
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }
        
        window.addEventListener('load', function() {
            document.getElementById('statusIndicator').textContent = 'Presione para hablar con IAM';
            // Estado inicial del avatar GIF animado: en línea (idle).
            setAvatarState('idle');
        });
    </script>
</body>
